name: Lean proof verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check source integrity and forbidden constructs
        run: |
          sha256sum --quiet -c files.sha256
          python3 scripts/check_forbidden.py .
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          build: 'true'
          build-args: 'LRXDiameter'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Verify theorem statements and audit all project axioms
        run: lake env lean Verify.lean
