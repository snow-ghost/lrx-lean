    human peer review. Counts of missing proofs exclude the two deliberate
    Challenge placeholders.
fidelity:
  divergences: >-
    The metric has three unit-cost moves L, R, X and is undirected.
    Rotations are charged their literal length; permutations are not identified
    modulo rotation. The range is n >= 4. No uniqueness or classification of
    extremal permutations is claimed. The all-pairs routing assertion ensures
    connectivity, so the natural-valued graph diameter has its ordinary meaning.
    Fin 3 words are proved to preserve evaluation and length under encoding
    from the existing LRX words. Existence uses classical reasoning rather
    than an executable shortest-word solver.
review:
  status: unchecked
  notes: >-
    No independent human peer review is asserted. Source alignment, Lean builds,
    axiom audits, and Comparator are technical checks. Any Palomar editorial
    review and registration are separate from preparation of this repository.
alignment:
