version: v0.4
project:
  name: Exact LRX diameter of the symmetric group
  description: >-
    For every n >= 4 the Cayley graph of S_n with unit-cost generators
    L = (0 1 ... n-1), R = L inverse, and X = (0 1) has diameter n*(n-1)/2.
    The formalization proves upper and lower bounds and a literal L/R/X
    word of at most that length between every ordered pair of permutations.
    The independent Challenge defines the moves, their word evaluation,
    and the undirected Cayley graph using Mathlib alone.
  authors:
    - S. Uskov
    - A. Chervov
    - F. Levkovich-Maslyuk
    - I. Litvak
    - A. Smolensky
    - A. Soibelman
    - Dia Taha
  responsible_maintainers: [S. Uskov]
  license: MIT
sources:
  - title: 'The LRX Cayley graph: exact diameter of the symmetric group in Lean 4'
    authors: [S. Uskov, A. Chervov, F. Levkovich-Maslyuk, I. Litvak, A. Smolensky, A. Soibelman, Dia Taha]
    id: https://github.com/snow-ghost/lrx-lean
    type: original-proof
    relationship: other
    note: >-
      This repository contains the substantive proof development, including
      both bounds and kernel-checked finite certificates. The Challenge and
      Solution expose the existing result through independent definitions.
      This is not a claim of priority for the conjecture or its computational evidence.
  - title: A186783, diameter of S_n generated by a transposition and both cyclic shifts
    authors: [OEIS Foundation Inc.]
    id: https://oeis.org/A186783
    type: other
    relationship: background
    note: >-
      Records the conjectured formula and computational history. The universal
      Lean theorem does not assume these computations or the conjecture.
  - title: 'CayleyPy RL: Pathfinding and Reinforcement Learning on Cayley Graphs'
    id: https://arxiv.org/abs/2502.18663v3
    type: paper
    location: Sections 4.1-4.3
    relationship: background
    note: >-
      Related conjectures, pathfinding, and diameter bounds. The triangle-parity
      observation used in lower-bound arguments is proved within this development.
      Bibliographic authorship is recorded at the versioned arXiv record.
  - title: A Lower Bound for the Diameter of Cayley Graph of the Symmetric Group S_n Generated by (12), (12...n), (1n...2)
    authors: [Grigorii Antiufeev]
    id: https://arxiv.org/abs/2601.08715v3
    type: paper
    relationship: background
    note: >-
      States the same sharp lower bound. No theorem, lemma, or intermediate
      assertion of this paper is used as an assumption in the formalization;
      the lower bound is proved in this repository.
