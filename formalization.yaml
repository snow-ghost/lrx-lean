      note: Derived from LRX.exact_diameter_all after identifying the independent Cayley graph.
    - source: Sharp upper bound between arbitrary permutations
      lean: PalomarLRX.boundedRouting
      module: Solution
      status: proved
      note: Derived from LRX.sharp_diameter_all with an evaluation- and length-preserving word encoding.
acknowledgements: Lean and Mathlib provide the proof language, kernel, and mathematical libraries.
