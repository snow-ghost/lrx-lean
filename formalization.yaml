      framework: OpenAI Codex
      tool_setup: Interactive coding agent with Lean, Mathlib, shell, Git, and literature search.
      prompting_notes: Human-directed mathematical work, formalization, cleanup, and preparation for Palomar.
  notes: >-
    AI assistance was material to mathematical proof development, formalization,
